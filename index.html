<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>STIVEN HACKER</title>

<style>
body {
    background: black;
    color: #00ff00;
    font-family: monospace;
    text-align: center;
    padding-top: 50px;
}

h1 {
    text-shadow: 0 0 10px lime;
}

#terminal {
    border: 1px solid lime;
    padding: 20px;
    margin: 20px;
    height: 250px;
    overflow: auto;
    text-align: left;
}

button {
    background: black;
    color: lime;
    border: 2px solid lime;
    padding: 15px;
    cursor: pointer;
    font-family: monospace;
}
</style>
</head>

<body>

<h1>STIVEN HACKER</h1>
<p>SISTEMA DE SIMULACIÓN</p>

<div id="terminal">
    > Sistema iniciado...<br>
    > Esperando comando...
</div>

<button onclick="hackear()">INICIAR HACKING</button>

<script>
function hackear() {
    let terminal = document.getElementById("terminal");

    terminal.innerHTML = "";

    let mensajes = [
        "> Iniciando simulación...",
        "> Analizando sistema...",
        "> Cargando códigos...",
        "> Procesando datos...",
        "> Acceso simulado...",
        "> SISTEMA ACTIVADO",
        "> JAJAJA TE HICE UNA BROMA",
        "> BY STIVEN HACKER"
    ];

    let i = 0;

    let intervalo = setInterval(function() {
        terminal.innerHTML += mensajes[i] + "<br>";
        terminal.scrollTop = terminal.scrollHeight;
        i++;

        if (i >= mensajes.length) {
            clearInterval(intervalo);
        }
    }, 1000);
}
</script>

</body>
</html>
